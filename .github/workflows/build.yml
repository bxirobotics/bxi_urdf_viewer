name: Build BXI viewer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: bxi-viewer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.models.outputs.changed }}
      commit: ${{ steps.models.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the four model directories against the published snapshot
        id: models
        run: node scripts/check-model-updates.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    needs: check
    if: ${{ !cancelled() && (needs.check.result == 'skipped' || (needs.check.result == 'success' && needs.check.outputs.changed == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Download BXI models, build and check ESA limits
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BXI_MODELS_REF: ${{ needs.check.outputs.commit || 'main' }}
      - uses: actions/upload-artifact@v4
        with:
          name: bxi-urdf-viewer
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bxi-urdf-viewer
          path: ${{ runner.temp }}/bxi-site
      - name: Publish the prebuilt website to the site branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin site; then
            git fetch origin site
            git checkout -B site FETCH_HEAD
          else
            git checkout --orphan site
          fi
          git rm -rf .
          mkdir dist
          cp -a "$RUNNER_TEMP/bxi-site/." dist/
          node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("dist/esa.jsonc", "utf8")); config.assets.directory = "./dist"; fs.writeFileSync("esa.jsonc", JSON.stringify(config, null, 2) + "\n");'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish BXI viewer from $GITHUB_SHA"
            git push origin HEAD:site
          fi
